<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Εργαλεία QR Code - Δημιουργία & Σάρωση</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        overscroll-behavior: none;
      }
      #qr-reader-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0,0,0,0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 50;
        padding: 1rem;
      }
      #qr-reader {
        width: 100%;
        max-width: 500px;
        background: black;
        border-radius: 1rem;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        border: 4px solid rgba(255, 255, 255, 0.2);
        position: relative;
      }

      .scanner-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 250px;
        height: 250px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .scanner-overlay::before,
      .scanner-overlay::after,
      .scanner-overlay > div::before,
      .scanner-overlay > div::after {
          content: '';
          position: absolute;
          width: 40px;
          height: 40px;
          border-style: solid;
          border-color: #00BFFF;
          border-width: 5px;
          animation: pulse-corners 2s infinite ease-in-out;
      }

      .scanner-overlay::before { top: -5px; left: -5px; border-right-width: 0; border-bottom-width: 0; }
      .scanner-overlay::after { top: -5px; right: -5px; border-left-width: 0; border-bottom-width: 0; }
      .scanner-overlay > div::before { bottom: -5px; left: -5px; border-right-width: 0; border-top-width: 0; }
      .scanner-overlay > div::after { bottom: -5px; right: -5px; border-left-width: 0; border-top-width: 0; }

      @keyframes pulse-corners {
        0% { opacity: 1; transform: scale(1); border-color: #00BFFF; }
        50% { opacity: 0.7; transform: scale(0.98); border-color: #87CEFA; }
        100% { opacity: 1; transform: scale(1); border-color: #00BFFF; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",

    "qrcode": "https://esm.sh/qrcode@1.5.3",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
